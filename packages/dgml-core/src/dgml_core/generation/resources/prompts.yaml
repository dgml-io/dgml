variants:
  # The fewshot worked example below is SYNTHETIC — hand-written for this
  # prompt, not drawn from any docset. Its domain (a construction subcontract)
  # is deliberately absent from the compass benchmark docsets so the variant
  # is never tuned to a document it is measured on.
  fewshot:
    label_system: |
      You assign SEMANTIC CONCEPTS to transcribed document blocks. The documents
