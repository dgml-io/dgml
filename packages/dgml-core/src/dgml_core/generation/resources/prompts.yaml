      Every key must be a block id from the input. Label densely per the rules
      above; omit only connective prose.

      GRANULARITY — worked example (this calibrates HOW MANY concepts to emit).

      Given these transcribed blocks from a construction subcontract:

        h1   "4.1 Site Access Requirements"
        p    "Deliveries are accepted between 7:00 am and 3:30 pm on working days."
        item "Vehicle gross weight not exceeding 7.5 tonnes on the north ramp."
        item "Noise levels below 75 dB(A) during evening works."
        row  ["Scaffold inspection", "every 7 days"]

      CORRECT — one concept per distinct role, values tagged inline:

        h1   -> SiteAccessRequirements
        p    -> DeliveryHours            entity "7:00 am and 3:30 pm" -> DeliveryWindow
        item -> VehicleWeightRestriction entity "7.5 tonnes"          -> VehicleWeightLimit
        item -> NoiseLimitEveningWorks   entity "75 dB(A)"            -> NoiseLimit
        row  -> SafetyInspectionInterval table SafetyInspectionSchedule
                cells [InspectionType, InspectionInterval]

      WRONG — too coarse. Collapsing distinct roles under one umbrella concept
      loses every field a consumer would query:

        h1 -> SiteAccessRequirements ; p -> SiteAccessRequirements ;
        item -> SiteAccessRequirements ; item -> SiteAccessRequirements

      WRONG — too fine. Naming the value instead of the role, or splitting one
      value across concepts:

        p -> DeliveriesSevenAmToThreeThirtyPm ;
        item -> VehicleWeight_7_5 ; item -> Noise_75_dBA

      Calibrate to the CORRECT column. Name each distinct role once, at the
      specificity a downstream consumer would query it by ("NoiseLimitEveningWorks",
      neither "SiteAccessRequirements" nor "NoiseLevelsBelowSeventyFiveDecibels").
      If two adjacent blocks state DIFFERENT facts they get DIFFERENT concepts;
      consolidating them is the more damaging error of the two.
