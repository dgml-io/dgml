[project]
name = "dgml-sample-service"
version = "0.1.0"
description = "Sample multi-tenant service that embeds dgml-core as a library: FastAPI + Postgres docs + S3 blobs."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Docugami" }]
readme = "README.md"
# Every direct dep is on the allow-list:
#   fastapi (MIT), uvicorn (BSD-3), python-multipart (Apache-2.0),
#   sqlalchemy (MIT), pg8000 (BSD-3).
# The Postgres driver is pg8000 rather than psycopg/psycopg2, which are LGPL and
# banned as direct deps (see the repo's CLAUDE.md).
dependencies = [
    "dgml-core[pdfium]>=0.1.0",
    "dgml-storage-s3>=0.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pg8000>=1.31",
]

[project.scripts]
dgml-sample-service = "dgml_sample_service.__main__:main"

[tool.uv.sources]
dgml-core = { workspace = true }
dgml-storage-s3 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgml_sample_service"]
