name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # `.gemini/skills/*` are hand-kept mirrors of the canonical `.claude/skills/*`
      # copies; a stale one teaches an agent a CLI surface that no longer exists.
      - name: Check agent skill mirrors
        run: scripts/check-agent-skills.sh

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev --locked
      - run: uv run mypy packages

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install ghostscript
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev --locked
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - run: uv run pytest

  storage-parity:
    # The sample S3+Mongo store, run against real backing services.
    #
    # The default `uv run pytest` already runs this suite against in-process
    # fakes (moto/mongomock), so it is never silently absent. This job points it
    # at SeaweedFS and MongoDB instead, which is what exercises wire behaviour the
    # fakes only approximate: genuine list_objects_v2 pagination, real error
    # codes, multipart. Two of the storage layer's worst defects were invisible
    # to every local-disk test, so this is the job that stops that recurring.
    name: Storage parity (S3 + MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Start SeaweedFS (S3)
        # The SeaweedFS image needs a command (`server -s3`) to start, which
        # GitHub Actions service containers can't provide — so run it as a step
        # and wait for readiness. (Matches
        # packages/dgml-storage-s3/docker-compose.yml.) The S3 gateway listens on
        # 8333 and is published on 9000, so the endpoint below is a plain S3
        # address.
        #
        # The probe is deliberately vendor-neutral: any HTTP response on the S3
        # port means the gateway is listening. Matching a vendor-specific health
        # path would couple CI to whichever server we happen to run.
        run: |
          docker run -d --name seaweedfs -p 9000:8333 \
            chrislusf/seaweedfs:4.47 server -s3 -dir=/data
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/ || true)
            case "$code" in
              200|403|404) echo "S3 endpoint is up (HTTP $code)"; exit 0 ;;
            esac
            sleep 2
          done
          echo "S3 endpoint did not become ready" >&2
          docker logs seaweedfs || true
          exit 1
      - name: Install ghostscript
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev --locked
      - run: uv run pytest packages/dgml-storage-s3 packages/dgml-storage-mongo -v
        env:
          DGML_TEST_S3_ENDPOINT: http://localhost:9000
          DGML_TEST_MONGO_URI: mongodb://localhost:27017
          AWS_ACCESS_KEY_ID: dgmltest
          AWS_SECRET_ACCESS_KEY: dgmltest123
          AWS_DEFAULT_REGION: us-east-1

  license-audit:
    name: License audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev --locked
      - name: Fail on copyleft dependencies
        # `--partial-match` is required for the deny tokens (GPL, AGPL, …)
        # to match real license strings like "GNU General Public License
        # v3 (GPLv3)" — without it pip-licenses does exact-string match
        # and silently passes everything. MPL is intentionally not in
        # the list: it's weak (file-level) copyleft, and tooling we rely
        # on (certifi, tqdm, pathspec) ships it transitively. See
        # CLAUDE.md "License compatibility" for the policy.
        run: |
          uv run pip-licenses \
            --from=mixed \
            --partial-match \
            --fail-on="GPL;LGPL;AGPL;SSPL;EUPL;CC-BY-SA"
